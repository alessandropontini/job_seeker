# Daily Job-Matching System Configuration (scaffold)

sources:
  # List of job sources to ingest from (no scraping behind logins)
  # - name: example_source
  #   type: api | rss | html
  #   endpoint: https://example.com/jobs
  #   enabled: false
  placeholders: []

location_rules:
  include_regions:
    - EU
  include_countries:
    - Italy
  include_cities:
    - New York
  exclude_countries:
    - UK
  prefer_full_remote: true

role_targeting:
  include_titles:
    - manager
    - lead

salary_rules:
  minimum_eur: 52000
  flag_missing_salary: true

notifications:
  telegram:
    enabled: false
    bot_token_env_var: TELEGRAM_BOT_TOKEN
    chat_id_env_var: TELEGRAM_CHAT_ID
