# Daily Job-Matching System Configuration (scaffold)

sources:
  # List of job sources to ingest from (no scraping behind logins)
  # Example:
  #   enabled:
  #     - remotive
  enabled:
    - dummy
  placeholders: []

location_rules:
  include_regions:
    - EU
  include_countries:
    - Italy
  include_cities:
    - New York
  exclude_countries:
    - UK
  prefer_full_remote: true

role_targeting:
  include_titles:
    - manager
    - lead
    - head

salary_rules:
  minimum_eur: 52000
  allow_missing_salary: true
  # Approximate exchange rates for normalization to EUR.
  currency_rates:
    EUR: 1.0
    USD: 0.92
    GBP: 1.17

notifications:
  telegram:
    enabled: false
    bot_token_env_var: TELEGRAM_BOT_TOKEN
    chat_id_env_var: TELEGRAM_CHAT_ID
