# Daily Job-Matching System Configuration (scaffold)

sources:
  # List of job sources to ingest from (no scraping behind logins)
  # Example:
  #   enabled:
  #     - remotive
  enabled:
    - dummy
  placeholders: []
  greenhouse:
    boards:
      - datadog
      - mongodb
      - sumup
      - doctolib
      - elastic
      - monzo
      - contentful
      - n26
  lever:
    companies: []

regions_path: config/regions.json

location_rules:
  include_regions:
    - EU
  include_countries:
    - Italy
  include_cities:
    - New York
  exclude_countries:
    - UK
  prefer_full_remote: true
  allow_unknown_location: true

role_targeting:
  include_titles:
    - manager
    - lead
    - head
    - director
    - architect
    - solution architect
    - solutions architect
    - data architect
    - enterprise architect
    - platform architect
    - cloud architect
    - technology owner
    - data owner
    - data technology owner

salary_rules:
  minimum_eur: 52000
  allow_missing_salary: true
  # Approximate exchange rates for normalization to EUR.
  currency_rates:
    EUR: 1.0
    USD: 0.92
    GBP: 1.17

channels:
  top_matches:
    top_n: 10
    min_score: 0
    include_missing_salary: true
  data_only_best_picks:
    top_n: 10
    min_score: 0
    require_data_signal: true
    exclude_top_matches: true
    keywords:
      - data
      - data governance
      - data quality
      - data management
      - data stewardship
      - data catalog
      - data lineage
      - metadata
      - master data
      - reference data
      - governance
      - bcbs 239
      - collibra
      - informatica
      - alation
    secondary_keywords:
      - compliance
      - privacy
      - gdpr
      - catalog
      - lineage
      - steward
      - quality
      - bigquery
      - gcp
      - purview

personalization:
  enabled: true
  feedback_enabled: true
  profile_path: preferences.json
  token_weight_step: 2
  tag_weight_step: 1
  remote_level_step: 2
  seniority_step: 1
  max_abs_weight: 10
  min_token_length: 3
  cache_limit: 200
  seniority_keywords:
    - manager
    - lead
    - head
    - director
    - architect
  duplicate_action: skip

scoring:
  base_score: 100
  penalty_weights:
    prefer_full_remote: 15
    missing_salary: 10
    unknown_location: 8
  bonus_weights:
    full_remote: 5
  data_governance_boost: 20
  data_governance_secondary_boost: 5
  data_governance_keywords:
    - data governance
    - data management
    - data quality
    - data stewardship
    - metadata
    - metadata management
    - data lineage
    - data catalog
    - data ownership
    - mdm
    - master data
    - reference data
    - bcbs 239
    - governance controls
    - data standards
    - data operating model
    - data architecture
    - solution architecture
    - enterprise architecture
    - dama-dmbok
    - axon
    - collibra
    - informatica
    - alation
    - erwin
    - edc
    - microsoft purview
  data_governance_secondary_keywords:
    - bigquery
    - gcp
    - cloud data platform
    - dataflow
    - dataproc
    - databricks
    - power bi
    - tableau
    - superset
    - sql
    - python

notifications:
  telegram:
    enabled: true
    dry_run: false
    top_n: 10
    min_score: 0
    min_score_improvement: 3
    send_per_job: true
    send_header: true
    persist_payload: false
  dedupe:
    enabled: true
    state_path: last_notified.json

state:
  suffix: null
  dir: null

feedback:
  enabled: true
  webhook_base_url: null
  webhook_secret: null
  window_minutes: 60
  use_telegram_updates: false

digest:
  mode: daily_window
  window_hours: 24
  top_n: 10
  selection:
    min_results: 5
    high_threshold: 70
    low_threshold: 40
    step: 5
