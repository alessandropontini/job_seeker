# Daily Job-Matching System Configuration (scaffold)

sources:
  # List of job sources to ingest from (no scraping behind logins)
  # Example:
  #   enabled:
  #     - remotive
  enabled:
    - dummy
  placeholders: []

regions_path: config/regions.json

location_rules:
  include_regions:
    - EU
  include_countries:
    - Italy
  include_cities:
    - New York
  exclude_countries:
    - UK
  prefer_full_remote: true
  allow_unknown_location: true

role_targeting:
  include_titles:
    - manager
    - lead
    - head

salary_rules:
  minimum_eur: 52000
  allow_missing_salary: true
  # Approximate exchange rates for normalization to EUR.
  currency_rates:
    EUR: 1.0
    USD: 0.92
    GBP: 1.17

channels:
  top_matches:
    top_n: 10
    min_score: 0
    include_missing_salary: true
  data_only_best_picks:
    top_n: 10
    min_score: 0
    require_data_signal: true
    exclude_top_matches: true
    keywords:
      - data
      - data governance
      - data quality
      - data management
      - data stewardship
      - data catalog
      - data lineage
      - metadata
      - master data
      - reference data
      - governance
      - compliance
      - bcbs 239
      - collibra
      - informatica
      - alation
    secondary_keywords:
      - catalog
      - lineage
      - steward
      - quality
      - bigquery
      - gcp
      - purview

personalization:
  enabled: false
  feedback_enabled: true
  profile_path: preferences.json
  token_weight_step: 2
  tag_weight_step: 1
  remote_level_step: 2
  seniority_step: 1
  max_abs_weight: 10
  min_token_length: 3
  cache_limit: 200
  seniority_keywords:
    - manager
    - lead
    - head
  duplicate_action: skip

scoring:
  base_score: 100
  penalty_weights:
    prefer_full_remote: 15
    missing_salary: 10
    unknown_location: 8
  bonus_weights:
    full_remote: 5
  data_governance_boost: 20
  data_governance_secondary_boost: 5
  data_governance_keywords:
    - data governance
    - data management
    - data quality
    - data stewardship
    - metadata
    - data lineage
    - data catalog
    - data ownership
    - mdm
    - master data
    - reference data
    - bcbs 239
    - dama-dmbok
    - collibra
    - informatica
    - alation
    - microsoft purview
  data_governance_secondary_keywords:
    - bigquery
    - gcp
    - cloud data platform

notifications:
  telegram:
    enabled: true
    dry_run: false
    top_n: 10
    min_score: 0
    min_score_improvement: 3
  dedupe:
    enabled: true
    state_path: last_notified.json

state:
  suffix: null
  dir: null

digest:
  mode: daily_window
  window_hours: 24
  top_n: 10
