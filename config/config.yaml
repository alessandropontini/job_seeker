# Daily Job-Matching System Configuration (scaffold)

sources:
  # List of job sources to ingest from (no scraping behind logins)
  # Example:
  #   enabled:
  #     - remotive
  enabled:
    - dummy
  placeholders: []

regions_path: config/regions.json

location_rules:
  include_regions:
    - EU
  include_countries:
    - Italy
  include_cities:
    - New York
  exclude_countries:
    - UK
  prefer_full_remote: true
  allow_unknown_location: true

role_targeting:
  include_titles:
    - manager
    - lead
    - head

salary_rules:
  minimum_eur: 52000
  allow_missing_salary: true
  # Approximate exchange rates for normalization to EUR.
  currency_rates:
    EUR: 1.0
    USD: 0.92
    GBP: 1.17

scoring:
  base_score: 100
  penalty_weights:
    prefer_full_remote: 15
    missing_salary: 10
    unknown_location: 8
  bonus_weights:
    full_remote: 5
  data_governance_boost: 20
  data_governance_secondary_boost: 5
  data_governance_keywords:
    - data governance
    - data management
    - data quality
    - data stewardship
    - metadata
    - data lineage
    - data catalog
    - data ownership
    - mdm
    - master data
    - reference data
    - bcbs 239
    - dama-dmbok
    - collibra
    - informatica
    - alation
    - microsoft purview
  data_governance_secondary_keywords:
    - bigquery
    - gcp
    - cloud data platform

notifications:
  telegram:
    enabled: true
    top_n: 10
    min_score: 0
    min_score_improvement: 3
