name = "job-scout-telegram-feedback"
main = "worker.js"
compatibility_date = "2024-10-01"

kv_namespaces = [
  { binding = "JOB_SCOUT_KV", id = "REPLACE_WITH_NAMESPACE_ID" }
]

[triggers]
crons = ["0 6 * * *", "0 7 * * *"]

[vars]
FEEDBACK_WINDOW_MINUTES = "1440"
JOB_SCOUT_ENV = "staging"
GITHUB_OWNER = "alessandropontini"
GITHUB_REPO = "job_seeker"
GITHUB_REF = "main"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
