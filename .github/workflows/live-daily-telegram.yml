name: live-daily-telegram

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Source name"
        required: false
        default: remotive
      since_days:
        description: "Fetch horizon in days (manual debug: 7/30)"
        required: false
        default: "1"
      force_send:
        description: "Force Telegram send even when zero matches"
        required: false
        type: boolean
        default: false
      run_mode:
        description: "Run mode"
        required: false
        type: choice
        options:
          - manual
          - scheduled
        default: manual
      telegram_message_thread_id:
        description: "Optional Telegram topic/thread id for forum groups"
        required: false
        default: ""

jobs:
  live-daily-telegram:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      JOB_SCOUT_WEBHOOK_BASE_URL: ${{ secrets.JOB_SCOUT_WEBHOOK_BASE_URL }}
      JOB_SCOUT_WEBHOOK_SECRET: ${{ secrets.JOB_SCOUT_WEBHOOK_SECRET }}
      JOB_SCOUT_TELEGRAM_MODE: real
      JOB_SCOUT_E2E_REAL_TELEGRAM: "1"
      JOB_SCOUT_RUN_MODE: scheduled
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Time gate (Europe/Rome 08:00) for schedule
        id: time_gate
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          hour_local="$(TZ=Europe/Rome date +%H)"
          if [[ "${hour_local}" != "08" ]]; then
            cat > out/run_summary.json <<JSON
          {
            "run_mode": "scheduled",
            "reason": "time_gate_skip",
            "timezone": "Europe/Rome",
            "local_hour": "${hour_local}",
            "telegram_attempted": false,
            "telegram_ok": false
          }
          JSON
            echo "run_allowed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_allowed=1" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: ${{ github.event_name != 'schedule' || steps.time_gate.outputs.run_allowed == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi

      - name: Run scheduled mode
        if: ${{ github.event_name == 'schedule' && steps.time_gate.outputs.run_allowed == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m job_scout run \
            --config config/config.yaml \
            --source remotive \
            --since-days 1 \
            --state-suffix live \
            --output-dir out \
            --run-mode scheduled

      - name: Run manual mode
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          TELEGRAM_MESSAGE_THREAD_ID: ${{ inputs.telegram_message_thread_id }}
        run: |
          set -euo pipefail
          source_name="${{ inputs.source || 'remotive' }}"
          since_days="${{ inputs.since_days || '1' }}"
          force_send="${{ inputs.force_send && '1' || '0' }}"
          run_mode="${{ inputs.run_mode || 'manual' }}"
          args=(
            -m job_scout run
            --config config/config.yaml
            --source "${source_name}"
            --since-days "${since_days}"
            --state-suffix live
            --output-dir out
            --run-mode "${run_mode}"
            --feedback-smoke-check
          )
          if [[ "${force_send}" == "1" || "${run_mode}" == "manual" ]]; then
            args+=(--force-send)
          fi
          python "${args[@]}"

      - name: Ensure run_summary.json exists
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [[ ! -f out/run_summary.json ]]; then
            cat > out/run_summary.json <<'JSON'
          {
            "notified": "no",
            "reason": "workflow_failed_before_summary",
            "telegram_attempted": false,
            "telegram_ok": false
          }
          JSON
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-daily-telegram
          if-no-files-found: warn
          path: |
            out/
            out/last_run.json
            out/run_summary.json
            out/telegram_payload.json
            out/telegram_send_response.json
            out/telegram_chat_check.json
            out/feedback_registration_result.log
