name: Build pytest wheelhouse (py311)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build-wheelhouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Download wheelhouse
        run: |
          mkdir -p wheelhouse
          python -m pip download --only-binary=:all: --dest wheelhouse "pytest>=7.4,<9"

      - name: Add third-party notices
        run: |
          mkdir -p THIRD_PARTY_LICENSES
          cat <<'NOTICE' > THIRD_PARTY_LICENSES/NOTICE
          This wheelhouse bundles the following Python packages:
          - pytest (https://pypi.org/project/pytest/) — MIT License
          - pluggy (https://pypi.org/project/pluggy/) — MIT License
          - iniconfig (https://pypi.org/project/iniconfig/) — MIT License
          - packaging (https://pypi.org/project/packaging/) — Apache-2.0 or BSD-2-Clause
          - pygments (https://pypi.org/project/pygments/) — BSD License
          - exceptiongroup (https://pypi.org/project/exceptiongroup/) — MIT License
          - tomli (https://pypi.org/project/tomli/) — MIT License
          - typing-extensions (https://pypi.org/project/typing-extensions/) — Python Software Foundation License
          NOTICE

      - name: Create wheelhouse archive
        run: zip -r wheelhouse-py311.zip wheelhouse THIRD_PARTY_LICENSES

      - name: Upload wheelhouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheelhouse-py311
          path: wheelhouse-py311.zip
