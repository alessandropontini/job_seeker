name: tests

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run pytest (requires pytest available)"
        required: false
        default: "false"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests (optional)
        if: ${{ inputs.run_tests == 'true' }}
        env:
          NO_NETWORK: "1"
        run: |
          if ! python -m pytest --version; then
            echo "pytest not available in runner; skipping tests"
            exit 0
          fi
          pytest -q
