name: job-scout-scheduled-run

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      offline:
        description: "Run with NO_NETWORK=1 (offline mode)"
        required: false
        default: "false"
      since_days:
        description: "Days back to query"
        required: false
        default: "1"

jobs:
  run-job-scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore notification snapshot cache
        uses: actions/cache@v4
        with:
          path: out/state.json
          key: job-scout-state-${{ hashFiles('out/state.json') }}
          restore-keys: |
            job-scout-state-

      - name: Check notification secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set; notifications will be skipped."
          fi

      - name: Run pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          OFFLINE_MODE="${{ github.event_name == 'workflow_dispatch' && inputs.offline == 'true' }}"
          SINCE_DAYS="${{ inputs.since_days || '1' }}"
          if [ "$OFFLINE_MODE" = "true" ]; then
            export NO_NETWORK=1
          fi
          python -m job_scout run --since-days "$SINCE_DAYS"

      - name: Save notification snapshot cache
        uses: actions/cache@v4
        with:
          path: out/state.json
          key: job-scout-state-${{ hashFiles('out/state.json') }}
