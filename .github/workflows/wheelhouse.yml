name: wheelhouse

on:
  workflow_dispatch:

jobs:
  build-wheelhouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheelhouse cache
        run: |
          python -m pip install --upgrade pip
          mkdir -p out/wheelhouse
          pip wheel -r requirements-dev.txt -w out/wheelhouse

      - name: Upload wheelhouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheelhouse
          path: out/wheelhouse
