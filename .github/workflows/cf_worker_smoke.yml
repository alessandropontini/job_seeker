name: cf_worker_smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      JOB_SCOUT_WEBHOOK_BASE_URL: ${{ secrets.JOB_SCOUT_WEBHOOK_BASE_URL }}
      JOB_SCOUT_WEBHOOK_SECRET: ${{ secrets.JOB_SCOUT_WEBHOOK_SECRET }}
      ALLOWED_TELEGRAM_USER_ID: ${{ secrets.ALLOWED_TELEGRAM_USER_ID }}
    steps:
      - name: Smoke test Telegram callback endpoint
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${JOB_SCOUT_WEBHOOK_BASE_URL}" ]]; then
            echo "JOB_SCOUT_WEBHOOK_BASE_URL is not set."
            exit 1
          fi
          if [[ -z "${JOB_SCOUT_WEBHOOK_SECRET}" ]]; then
            echo "JOB_SCOUT_WEBHOOK_SECRET is not set."
            exit 1
          fi
          if [[ -z "${ALLOWED_TELEGRAM_USER_ID}" ]]; then
            echo "ALLOWED_TELEGRAM_USER_ID is not set."
            exit 1
          fi

          if ! [[ "${ALLOWED_TELEGRAM_USER_ID}" =~ ^[0-9]+$ ]]; then
            echo "ALLOWED_TELEGRAM_USER_ID must be numeric."
            exit 1
          fi

          base_url="${JOB_SCOUT_WEBHOOK_BASE_URL%/}"
          endpoint="${base_url}/telegram/feedback"
          payload="{\"update_id\":1,\"callback_query\":{\"id\":\"smoke-callback\",\"from\":{\"id\":${ALLOWED_TELEGRAM_USER_ID}},\"data\":\"LIKE_TEST\",\"message\":{\"message_id\":1}}}"

          response_file="$(mktemp)"
          curl_error_file="$(mktemp)"
          http_status=""

          if ! http_status="$(curl -sS \
            -o "${response_file}" \
            -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 30 \
            -H "Content-Type: application/json" \
            -H "X-Telegram-Bot-Api-Secret-Token: ${JOB_SCOUT_WEBHOOK_SECRET}" \
            -d "${payload}" \
            "${endpoint}" \
            2>"${curl_error_file}")"; then
            echo "status=000"
            echo "body=$(head -c 120 "${curl_error_file}" | tr '\n' ' ')"
            echo "Smoke test failed: curl execution error."
            exit 1
          fi

          body_preview="$(head -c 120 "${response_file}" | tr '\n' ' ')"
          echo "status=${http_status}"
          echo "body=${body_preview}"

          if [[ "${http_status}" == "200" || "${http_status}" == "204" ]]; then
            echo "Smoke test passed."
            exit 0
          fi

          if [[ "${http_status}" == "401" || "${http_status}" == "403" || "${http_status}" == "404" || "${http_status}" == "405" ]]; then
            echo "Smoke test failed: endpoint/auth validation failed."
            exit 1
          fi

          echo "Smoke test failed: unexpected HTTP status."
          exit 1
