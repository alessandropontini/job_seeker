name: deploy-feedback-worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deploy environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod
  push:
    branches:
      - main
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/deploy_worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WRANGLER_VERSION: "4.41.0"
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
      TARGET_ENV: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required Cloudflare secrets
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "${CF_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "${CF_KV_NAMESPACE_ID:-}" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_KV_NAMESPACE_ID"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler (pinned)
        run: npm i -g wrangler@${WRANGLER_VERSION}

      - name: Verify Wrangler version is 4.41.x
        run: |
          set -euo pipefail
          WRANGLER_ACTUAL="$(wrangler --version)"
          echo "Wrangler version: ${WRANGLER_ACTUAL}"
          if ! echo "${WRANGLER_ACTUAL}" | grep -Eq '^4\.41\.'; then
            echo "::error::Expected Wrangler 4.41.x but got '${WRANGLER_ACTUAL}'"
            exit 1
          fi

      - name: Locate worker directory
        id: locate
        run: |
          set -euo pipefail
          WORKER_TOML="$(git ls-files | grep -m1 '^cloudflare/worker/wrangler\.toml$' || true)"
          if [ -z "${WORKER_TOML}" ]; then
            WORKER_TOML="$(git ls-files | grep -m1 'wrangler\.toml$' || true)"
          fi
          if [ -z "${WORKER_TOML}" ]; then
            echo "::error::No wrangler.toml found in repository"
            exit 1
          fi
          WORKER_DIR="$(dirname "${WORKER_TOML}")"
          echo "worker_toml=${WORKER_TOML}" >> "$GITHUB_OUTPUT"
          echo "worker_dir=${WORKER_DIR}" >> "$GITHUB_OUTPUT"
          echo "Found Worker directory: ${WORKER_DIR}"

      - name: Validate worker name in wrangler.toml
        run: |
          set -euo pipefail
          TOML="${{ steps.locate.outputs.worker_toml }}"
          if ! grep -Eq '^name\s*=\s*"job-scout-telegram-feedback"\s*$' "${TOML}"; then
            echo "::error::${TOML} does not contain name = \"job-scout-telegram-feedback\""
            exit 1
          fi

      - name: JS syntax check before deploy
        run: |
          set -euo pipefail
          node --check "${{ steps.locate.outputs.worker_dir }}/worker.js"

      - name: Inject KV namespace id into wrangler.toml
        run: |
          set -euo pipefail
          TOML="${{ steps.locate.outputs.worker_toml }}"
          sed -i.bak "s/REPLACE_WITH_NAMESPACE_ID/${CF_KV_NAMESPACE_ID}/g" "${TOML}"
          rm -f "${TOML}.bak"
          if grep -q "REPLACE_WITH_NAMESPACE_ID" "${TOML}"; then
            echo "::error::KV namespace placeholder still present in ${TOML}"
            exit 1
          fi
          echo "Injected Cloudflare KV namespace id into ${TOML}"

      - name: Wrangler identity (whoami)
        run: |
          set -euo pipefail
          wrangler whoami || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

      - name: Deploy Worker
        run: |
          set -euo pipefail
          cd "${{ steps.locate.outputs.worker_dir }}"
          if [ "${TARGET_ENV}" = "staging" ]; then
            wrangler deploy --config wrangler.toml
          else
            wrangler deploy --config wrangler.toml --env "${TARGET_ENV}"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

      - name: Post-deploy diagnostics
        run: |
          set -euo pipefail
          echo "UTC timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Commit SHA: ${GITHUB_SHA}"
          cd "${{ steps.locate.outputs.worker_dir }}"
          wrangler deployments list --name job-scout-telegram-feedback || wrangler deployments list || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
