name: deploy-feedback-worker

on:
  workflow_dispatch:
  push:
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/deploy_worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WRANGLER_VERSION: "3.89.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Worker namespace
        run: |
          sed -i "s/REPLACE_WITH_NAMESPACE_ID/${CLOUDFLARE_KV_NAMESPACE_ID}/" cloudflare/worker/wrangler.toml
        env:
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}

      - name: Deploy Worker (bootstrap without secrets)
        # First deploy must NOT upload secrets. This avoids the wrangler-action bulk
        # secrets bug when the Worker script does not exist yet.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "cloudflare/worker"
          wranglerVersion: ${{ env.WRANGLER_VERSION }}

      - name: Upload Worker secrets (after script exists)
        # Upload secrets only after the Worker exists to avoid "Failed to upload secrets".
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_SCOUT_WEBHOOK_SECRET: ${{ secrets.JOB_SCOUT_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          printf "%s" "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@${WRANGLER_VERSION} secret put TELEGRAM_BOT_TOKEN
          printf "%s" "$JOB_SCOUT_WEBHOOK_SECRET" | npx --yes wrangler@${WRANGLER_VERSION} secret put JOB_SCOUT_WEBHOOK_SECRET

      - name: Deploy Worker (finalize bindings)
        # Re-deploy to ensure secrets/bindings are active and the deploy is idempotent.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "cloudflare/worker"
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
