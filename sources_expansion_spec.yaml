version: 1
scope: sources-expansion
constraints:
  transport:
    - api
    - rss
  forbidden:
    - playwright
    - browser-automation
    - login-required-scraping

implemented:
  cli:
    legacy_source_flag: "--source"
    multi_source_flag: "--sources"
    all_keyword: "all"
    compatibility: "--source remains supported; --sources can be combined"

  sources:
    - name: remotive
      type: api
      endpoint: "https://remotive.com/api/remote-jobs"
      attribution: "Remotive public API"
    - name: wwr
      type: rss
      endpoint: "https://weworkremotely.com/remote-jobs.rss"
      attribution: "We Work Remotely public RSS"
    - name: arbeitnow
      type: api
      endpoint: "https://www.arbeitnow.com/api/job-board-api"
      attribution: "Arbeitnow free public Job Board API"
    - name: greenhouse
      type: api
      endpoint: "https://boards-api.greenhouse.io/v1/boards/{board}/jobs?content=true"
      attribution: "Greenhouse Job Board API across curated public company boards"
    - name: lever
      type: api
      endpoint: "https://api.lever.co/v0/postings/{company}?mode=json"
      attribution: "Lever public Postings API"

  normalized_schema:
    - id
    - source
    - title
    - company
    - url
    - posted_at
    - location_text
    - location_country
    - remote_type
    - salary_text
    - currency

tests:
  - parse_wwr_rss_fixture
  - parse_arbeitnow_payload_fixture
  - parse_greenhouse_payload_fixture
  - parse_lever_payload_fixture
  - run_summary_source_counts
